<!--
  Triple Triad Autopilot icon (Sojiroh "Autopilot" family): radial crimson background, glowing dial ring with ticks,
  gold heading chevron on top, and a Triple Triad card with its four rank numbers in the middle.
  Render: rsvg-convert -w 512 -h 512 -b '#1f070d' Icon.svg -o Icon.png && magick Icon.png -alpha off Icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#7a2438"/>
      <stop offset="0.55" stop-color="#4a1426"/>
      <stop offset="1" stop-color="#1f070d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa3b0"/>
      <stop offset="1" stop-color="#e0243c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f4dbd2"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0566a"/>
      <stop offset="1" stop-color="#7a1a2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#e09a2b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- autopilot dial -->
  <g transform="translate(256 268)">
    <circle r="178" fill="none" stroke="#ff8a99" stroke-opacity="0.12" stroke-width="30"/>
    <circle r="178" fill="none" stroke="url(#ring)" stroke-width="10" filter="url(#glow)"/>
    <g stroke="#ffc8cf" stroke-linecap="round">
      <line y1="-150" y2="-132" stroke-width="7" transform="rotate(0)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(30)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(60)"/>
      <line y1="-150" y2="-132" stroke-width="7" transform="rotate(90)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(120)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(150)"/>
      <line y1="-150" y2="-132" stroke-width="7" transform="rotate(180)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(210)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(240)"/>
      <line y1="-150" y2="-132" stroke-width="7" transform="rotate(270)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(300)"/>
      <line y1="-150" y2="-138" stroke-width="5" transform="rotate(330)"/>
    </g>
  </g>

  <!-- heading chevron above the dial -->
  <path d="M256 34 L300 104 L256 86 L212 104 Z" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Triple Triad card -->
  <g filter="url(#glow)">
    <rect x="176" y="168" width="160" height="208" rx="22" fill="url(#cardEdge)"/>
    <rect x="186" y="176" width="140" height="190" rx="16" fill="url(#card)"/>
  </g>
  <rect x="196" y="186" width="120" height="170" rx="10" fill="none" stroke="#c0485a" stroke-opacity="0.45" stroke-width="3"/>

  <!-- gem in the middle of the card -->
  <path d="M256 256 L276 276 L256 296 L236 276 Z" fill="url(#gold)" stroke="#a8641a" stroke-width="3" stroke-linejoin="round"/>

  <!-- the four ranks: top, left, right, bottom -->
  <g font-family="DejaVu Sans, Verdana, sans-serif" font-weight="800" font-size="42" fill="#8c1226" text-anchor="middle">
    <text x="256" y="236">7</text>
    <text x="214" y="291">3</text>
    <text x="298" y="291">9</text>
    <text x="256" y="346">A</text>
  </g>
</svg>
